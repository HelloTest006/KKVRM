[project]
name = "kkvrm"
version = "0.1.0"
description = "Convert a Koikatsu Sunshine KKBP export to VRM 1.0"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
kkvrm = "kkvrm.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kkvrm*"]
