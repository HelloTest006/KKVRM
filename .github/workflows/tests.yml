name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unittest:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install .

      - name: Check CLI entry point
        run: python -m kkvrm --help

      - name: Syntax-check host and Blender-only modules
        run: python -m compileall -q kkvrm tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  # Requires a local Blender with KKBP, mmd_tools and the VRM add-on, plus a
  # real character export. GitHub runners cannot install the KKBP importer, so
  # this job is opt-in: run it locally with the commands in README.md.
