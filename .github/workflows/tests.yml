name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install ruff
        run: python -m pip install ruff==0.15.15

      - name: Lint (pyflakes, bugbear, pylint errors; see pyproject.toml)
        run: python -m ruff check kkvrm tests

  unittest:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and coverage
        run: python -m pip install . "coverage[toml]==7.14.1"

      - name: Check CLI entry point
        run: python -m kkvrm --help

      - name: Syntax-check host and Blender-only modules
        run: python -m compileall -q kkvrm tests

      # -X dev enables ResourceWarning and other runtime checks; -W error turns
      # every warning (unclosed files, deprecations) into a test failure.
      - name: Run unit tests with coverage
        run: python -X dev -W error -m coverage run -m unittest discover -s tests -v

      - name: Enforce coverage floor (host modules)
        run: python -m coverage report
